services:
  server:
    env_file:
      - .env.local

  db:
    env_file:
      - .env.local
    ports:
      - "5432:5432"

  # Expose Redis to the host so a host-run `pnpm dev` can reach the session
  # store and rate limiter (the base compose keeps it internal to appnet).
  redis:
    ports:
      - "6379:6379"