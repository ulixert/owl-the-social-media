services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks: [appnet]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  server:
    image: ghcr.io/ulixert/owl-server:latest
    env_file:
      - ./server/.prod.env
    environment:
      # Where DiskStorage writes uploads; backed by the named volume below so
      # images survive container restarts and redeploys.
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads

  migrate:
    image: ghcr.io/ulixert/owl-server:latest
    env_file:
      - ./server/.prod.env
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]
    restart: "no"
    working_dir: /app
    command: ["npx", "prisma", "migrate", "deploy"]

  # One-off curated demo seed. Behind the "seed" profile so it never runs on a
  # normal `up`; invoke explicitly:
  #   docker compose --profile seed run --rm seed-demo
  # Shares the uploads volume + UPLOAD_DIR with the server so seeded image files
  # land where the server serves them. Safe + idempotent (see prisma/seed/demo.ts).
  seed-demo:
    image: ghcr.io/ulixert/owl-server:latest
    profiles: ["seed"]
    env_file:
      - ./server/.prod.env
    environment:
      UPLOAD_DIR: /app/uploads
      DEMO_SEED_CONFIRM: "1"
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]
    restart: "no"
    working_dir: /app
    volumes:
      - uploads:/app/uploads
    command: ["node", "dist/seed-demo.mjs"]

  caddy:
    image: ghcr.io/ulixert/owl-client:latest
    ports:
      - "127.0.0.1:8001:80"
    depends_on:
      - server
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:

volumes:
  pg_data:
  uploads: